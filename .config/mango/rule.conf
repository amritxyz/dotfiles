# Window & Layer Rules

# Swallow
window_rule=app_id:^terminal$,is_term:1
window_rule=app_id:^foot$,is_term:1
window_rule=app_id:^footclient$,is_term:1
window_rule=app_id:^St$,is_term:1
window_rule=app_id:^alacritty$,is_term:1
window_rule=app_id:^kitty$,is_term:1

# Allow swallowing terminal
# window_rule=app_id:.*zathura.*,no_swallow:0,is_floating:0
# window_rule=app_id:^imv.*,no_swallow:0,is_floating:0

# no_swallow & Floating Window Overrides
window_rule=app_id:^float_win$,is_floating:1,no_swallow:1
window_rule=title:^float_win$,is_floating:1,no_swallow:1
window_rule=app_id:^float_term$,is_floating:1
window_rule=title:^float_term$,is_floating:1
window_rule=app_id:^fterm$,is_floating:1,is_term:1
window_rule=app_id:^floatterm$,is_floating:1,is_term:1

# Named Scratchpads
window_rule=app_id:^spterm$,is_named_scratchpad:1,width:1400,height:900
window_rule=app_id:^spcalc$,is_named_scratchpad:1,width:600,height:400
window_rule=app_id:^sptop$,is_named_scratchpad:1,width:1400,height:900
window_rule=app_id:^spmixer$,is_named_scratchpad:1,width:1000,height:600
window_rule=app_id:^spcmus$,is_named_scratchpad:1,width:1400,height:900

# Tag Assignments
window_rule=app_id:^Gimp$,tags:9
window_rule=app_id:^bg$,tags:8

# Dialogs & Floating Applications
window_rule=title:^Open$,is_floating:1
window_rule=title:^Choose Files$,is_floating:1
window_rule=title:^Save As$,is_floating:1
window_rule=title:^Confirm to replace files$,is_floating:1
window_rule=title:^File Operation Progress$,is_floating:1
window_rule=title:^webcam$,is_floating:1

window_rule=app_id:^xdg-desktop-portal-gtk$,is_floating:1
window_rule=app_id:^blueman-manager$,is_floating:1
window_rule=app_id:^com.gabm.satty$,is_overlay:1

# Immediate tearing for gaming
window_rule=app_id:^steam_app_genshin$,force_tearing:1

# Strict sizing adherence / Fake maximize
window_rule=app_id:^org.gnome.SystemMonitor$,force_fake_maximize:1
window_rule=app_id:^org.gnome.gThumb$,force_fake_maximize:1
window_rule=app_id:^firefox$,force_fake_maximize:1

# Layer Rules
layer_rule=layer_name:waybar,no_blur:1,no_animation:1
layer_rule=layer_name:launcher,no_blur:1,no_animation:1
layer_rule=layer_name:fuzzel,no_blur:1,no_animation:1
layer_rule=layer_name:selection,no_blur:1,no_animation:1
layer_rule=layer_name:slurp,no_blur:1,no_animation:1
layer_rule=layer_name:notifications,no_blur:1,no_animation:1
layer_rule=layer_name:swaync-control-center,no_blur:1,no_animation:1,no_shadow:1
layer_rule=layer_name:swaync-notification-window,no_blur:1,no_animation:1,no_shadow:1
