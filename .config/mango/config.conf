# MangoWM Main Configuration

# Effect & Decoration
blur=0
blur_layer=0
shadows=0
layer_shadows=0
shadow_only_floating=1

border_radius=0
no_radius_when_single=1
no_border_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Inactive Dimming
dim_enable=1

# Animations
animations=0
layer_animations=0
animation_fade_in=0
animation_fade_out=0

# Master-Stack Layout
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0
circle_layout=tile,monocle,deck,center_tile,scroller

# Monocle
monocle_tab_mode=0

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Scratchpad Settings
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.8
single_scratchpad=1
scratchpad_cross_monitor=0

# Overview Settings
hotarea_size=10
enable_hotarea=0
overview_gap_inner=5
overview_gap_outer=30

# Window Manager Behavior
axis_bind_apply_timeout=100
focus_on_activate=1
sloppy_focus=0
warp_cursor=1
focus_cross_monitor=1
focus_cross_tag=0
view_current_to_back=1
enable_floating_snap=1
snap_distance=32
cursor_size=24
cursor_theme=Adwaita
cursor_hide_timeout=3
allow_tearing=1
drag_tile_to_tile=1
drag_tile_small=1
xwayland_persistence=1
sync_obj_enable=1

# Keyboard Settings
repeat_rate=90
repeat_delay=250
numlock_on=1
xkb_rules_layout=us
xkb_rules_options=caps:swapescape,ctrl:menu_rctrl

# Trackpad & Mouse Settings
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
mouse_natural_scrolling=0
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
mouse_accel_profile=1
mouse_accel_speed=0.8

# Appearance: Gaps & Borders
gap_inner_horizontal=10
gap_inner_vertical=10
gap_outer_horizontal=20
gap_outer_vertical=10
border_px=2

# Special tag (Tag 0) gaps
special_gap_inner_horizontal=10
special_gap_inner_vertical=10
special_gap_outer_horizontal=30
special_gap_outer_vertical=20

# Sub-configs
source=./theme.conf
source=./env.conf
source=./bind.conf
source=./rule.conf
source=./monitor.conf
source=./tag.conf

# Autostart
exec_once=~/.config/mango/autostart.sh
