# Keybindings

# Config Reload & Session Control
bind=SUPER+SHIFT,r,reload_config

# Terminal & Application Launchers
bind=SUPER,Return,spawn,foot
bind=ALT+CTRL,Return,spawn,foot
bind=SUPER,w,spawn,firefox
bind=SUPER+SHIFT,w,spawn,firefox --private-window
bind=SUPER,d,spawn_shell,pkill -x fuzzel || ~/.local/bin/fuzzel.sh
bind=ALT,space,spawn_shell,pkill -x fuzzel || ~/.local/bin/fuzzel.sh
bind=ALT,d,spawn_shell,pkill -x fuzzel || ~/.local/bin/fuzzel.sh
bind=SUPER+CTRL,t,spawn,qbittorrent
bind=SUPER+SHIFT,b,spawn,bleachbit
bind=SUPER,i,spawn,foot -e lf
bind=SUPER+SHIFT,n,spawn,foot -e newsboat
bind=SUPER+SHIFT,p,spawn,foot -e nmtui

# Scratchpads
bind=SUPER+SHIFT,Return,toggle_named_scratchpad,spterm,none,foot -a spterm
bind=SUPER,apostrophe,toggle_named_scratchpad,spcalc,none,foot -a spcalc -e bc -lq
bind=SUPER,Escape,toggle_named_scratchpad,sptop,none,foot -a sptop -e btop
bind=SUPER,p,toggle_named_scratchpad,spmixer,none,foot -a spmixer -e pulsemixer
bind=SUPER+SHIFT,i,toggle_named_scratchpad,spcmus,none,foot -a spcmus -e cmus

# Special Tag / General Scratchpad
bind=SUPER,s,toggle_special_tag
bind=SUPER+SHIFT,s,tag_special_tag
bind=SUPER+CTRL,s,tag_special_silent
# bind=SUPER,grave,toggle_scratchpad
# bind=ALT,z,toggle_scratchpad

# Window Management
bind=SUPER,q,killclient
bind=ALT,q,killclient
bind=SUPER,r,togglefloating
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,f,togglefakefullscreen
bind=SUPER,space,zoom
bind=ALT,g,toggleglobal
bind=SUPER,o,spawn_shell,pkill -x fuzzel || ~/.local/bin/snippet.sh
bind=SUPER+SHIFT,o,spawn_shell,pkill -x fuzzel || ~/.local/bin/key.sh
bind=SUPER,n,spawn_shell,pkill -x fuzzel || ~/.local/bin/notes.sh
bind=SUPER,e,spawn_shell,pkill -x fuzzel || ~/.local/bin/emoji.sh

# Focus & Stack
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev
bind=SUPER+SHIFT,j,exchange_stack_client,next
bind=SUPER+SHIFT,k,exchange_stack_client,prev
bind=SUPER,h,setmfact,-0.05
bind=SUPER,l,setmfact,+0.05

# Directional Focus and Exchange
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# Layouts
bind=SUPER,t,setlayout,tile
bind=SUPER+SHIFT,t,setlayout,vertical_tile
bind=SUPER,c,setlayout,center_tile
bind=SUPER+SHIFT,c,spawn_shell,pkill -x slurp || ~/.local/bin/color_picker.sh
bind=SUPER,m,setlayout,monocle
bind=SUPER+SHIFT,m,setlayout,deck
bind=SUPER,u,setlayout,dwindle
bind=SUPER+SHIFT,u,setlayout,scroller
bind=SUPER+CTRL,space,switch_layout

# Gaps Management
bind=SUPER,a,togglegaps
bind=SUPER+SHIFT,a,reload_config
bind=SUPER,z,incgaps,3
bind=SUPER+SHIFT,z,incgaps,-3
bind=ALT+SHIFT,z,incgaps,3
bind=ALT+SHIFT,r,togglegaps

# Tag Behavior
# View Tag (1..9, 0=all)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,view,0

# Toggle View Tag (view multiple tags together)
bind=SUPER+CTRL,1,toggleview,1
bind=SUPER+CTRL,2,toggleview,2
bind=SUPER+CTRL,3,toggleview,3
bind=SUPER+CTRL,4,toggleview,4
bind=SUPER+CTRL,5,toggleview,5
bind=SUPER+CTRL,6,toggleview,6
bind=SUPER+CTRL,7,toggleview,7
bind=SUPER+CTRL,8,toggleview,8
bind=SUPER+CTRL,9,toggleview,9

# Tag Client (move client to tag and follow)
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER+SHIFT,0,tag,0

# Toggle Tag (client on multiple tags)
bind=SUPER+CTRL+SHIFT,1,toggletag,1
bind=SUPER+CTRL+SHIFT,2,toggletag,2
bind=SUPER+CTRL+SHIFT,3,toggletag,3
bind=SUPER+CTRL+SHIFT,4,toggletag,4
bind=SUPER+CTRL+SHIFT,5,toggletag,5
bind=SUPER+CTRL+SHIFT,6,toggletag,6
bind=SUPER+CTRL+SHIFT,7,toggletag,7
bind=SUPER+CTRL+SHIFT,8,toggletag,8
bind=SUPER+CTRL+SHIFT,9,toggletag,9

# Tag Navigation
bind=SUPER,Tab,view,-1,0
bind=SUPER,g,viewtoleft,0
bind=SUPER,semicolon,viewtoright,0
bind=SUPER+SHIFT,g,tagtoleft,0
bind=SUPER+SHIFT,semicolon,tagtoright,0
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0

# Monitor Management
bind=SUPER+SHIFT,h,focusmon,left
bind=SUPER+SHIFT,l,focusmon,right
bind=ALT+SHIFT,Left,focusmon,left
bind=ALT+SHIFT,Right,focusmon,right
bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right

# System, Utilities, Screenshots
bind=SUPER+SHIFT,q,spawn_shell,pkill -x fuzzel || ~/.local/bin/syslock
bind=SUPER,b,spawn_shell,pkill -x waybar || waybar
bind=SUPER+CTRL,u,spawn_shell,pkill -x swaybg || swaybg -c ffffff
bind=ALT+SHIFT,b,spawn_shell,pkill -x fuzzel || ~/.local/bin/blue.sh
bind=SUPER+SHIFT,BackSpace,spawn_shell,pkill -x fuzzel || ~/.local/bin/switch-theme.sh
# bind=SUPER,BackSpace,spawn,~/.local/bin/rec
bind=SUPER,x,spawn_shell,pkill -x slurp || ~/.local/bin/tmp_preview_grim.sh
bind=SUPER+SHIFT,x,spawn_shell,pkill -x slurp || ~/.local/bin/tmp_grim.sh
bind=SUPER,F11,spawn_shell,mpv --untimed --no-cache --no-osc --no-input-default-bindings --profile=low-latency --input-conf=/dev/null --title=webcam $(ls /dev/video* 2>/dev/null | tail -n 1)

# Audio & Brightness Controls
bind=none,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=none,F12,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=none,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=none,F11,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=none,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=none,F10,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=none,XF86AudioMicMute,spawn,pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind=none,F9,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0%

bind=none,XF86MonBrightnessUp,spawn,brightnessctl set 2%+
bind=none,XF86MonBrightnessDown,spawn,brightnessctl set 2%-
bind=ALT,p,spawn,brightnessctl set 2%+
bind=ALT,l,spawn,brightnessctl set 2%-

# Media Player Controls
bind=none,XF86AudioPlay,spawn,playerctl play-pause
bind=none,XF86AudioNext,spawn,playerctl next
bind=none,XF86AudioPrev,spawn,playerctl previous

# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
# mousebind=SUPER,btn_middle,zoom
mousebind=SUPER,btn_middle,togglemaximizescreen,0

# Axis & Gestures
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# gesturebind=none,left,3,focusdir,left
# gesturebind=none,right,3,focusdir,right
# gesturebind=none,up,3,focusdir,up
# gesturebind=none,down,3,focusdir,down
gesturebind=none,left,3,viewtoleft_have_client
gesturebind=none,right,3,viewtoright_have_client
